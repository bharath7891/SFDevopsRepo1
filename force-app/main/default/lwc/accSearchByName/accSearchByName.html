<template>
    <lightning-card>
        <div class="slds-var-m-around_medium">
            <lightning-input type="text" label="Search Key" value={searchKeyword} >
            </lightning-input>
        </div>

        <template if:true={accounts}>
            <div class="slds-var-m-around_medium">
                <template for:each={accounts} for:item="acc">
                    <lightning-layout key={acc.Id} class="slds-box slds-box_xx-small slds-var-m-around_xx-small">
                        <lightning-layout-item flexibility="grow">
                            <p>{acc.Name}</p>
                         </lightning-layout-item>
                    </lightning-layout>
                </template>
             
            </div>
            <div class="slds-var-m-around_medium">
                <br/>
                {error}
            </div>
        </template>
         
    </lightning-card>
</template>
