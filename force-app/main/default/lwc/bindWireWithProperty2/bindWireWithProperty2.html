<template>
    <lightning-card title="Wire with Property">

            <template if:true={accounts}>
                <div class="slds-var-m--around_medium">
                    <template for:each={accounts.data} for:item="acc">
                        
                        <!-- <lightning-button key={account.Id} label={account.Name} data-id={account.Id} onclick={handleClick} class="slds-var-m-around_xx-small">
                        </lightning-button> -->
                        <lightning-layout key={acc.Id} class="slds-var-m-vertical_x-small">
                            <lightning-layout-item flexibility="grow" >
                                {acc.Name}
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                </div>
            </template>
    </lightning-card>
</template>
