<template>
    <lightning-card title="Parent Component with Child Nested Iteration">
        <div class="slds-var-m-around_medium">
            <lightning-input type="text" label="Search Key" onchange={handleOnChange}>
                </lightning-input>
        </div>
        <div class="slds-var-m-around_medium">
                <template if:true={myData}>
                    <div class="slds-var-m-around_medium">
                        <template for:each={myData} for:item="acc">
                            <c-child-Component-Basic key={acc.Id}  mydata={acc}>
                            </c-child-Component-Basic>
                        </template>
                    </div>
                </template>
        </div>
       <!-- <template if:true={error}>
            <c-error-panel errors={error}></c-error-panel>
        </template>-->
    </lightning-card>
</template>
